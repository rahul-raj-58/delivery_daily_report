<title>Delivery Metrics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root {
  --bg:       #F3F6FB;
  --card:     #FFFFFF;
  --border:   #E2EAF4;
  --border-2: #D0DAF0;
  --bar-bg:   #FFFFFF;
  --tx1:      #0F172A;
  --tx2:      #475569;
  --tx3:      #94A3B8;
  --tx4:      #CBD5E1;

  --act:      #059669;    /* active pill green */
  --act-bg:   #059669;
  --act-text: #FFFFFF;

  --chart:    #0BA97A;    /* teal line */
  --dot-good: #22C55E;
  --dot-bad:  #EF4444;

  --good:     #059669;
  --warn:     #D97706;
  --crit:     #DC2626;

  --c-ent:  #2563EB;
  --c-mid:  #7C3AED;
  --c-res:  #DB2777;
  --c-smb:  #D97706;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:       #090D18;
    --card:     #101626;
    --border:   #1A2438;
    --border-2: #243050;
    --bar-bg:   #0C1020;
    --tx1:      #E4ECFF;
    --tx2:      #7A8BAA;
    --tx3:      #3E506A;
    --tx4:      #2A3A54;
    --act:      #059669;
    --chart:    #0BA97A;
    --dot-good: #22C55E;
    --dot-bad:  #EF4444;
    --good:     #10B981;
    --warn:     #F59E0B;
    --crit:     #EF4444;
  }
}
:root[data-theme="dark"] {
  --bg:       #090D18;
  --card:     #101626;
  --border:   #1A2438;
  --border-2: #243050;
  --bar-bg:   #0C1020;
  --tx1:      #E4ECFF;
  --tx2:      #7A8BAA;
  --tx3:      #3E506A;
  --tx4:      #2A3A54;
  --act:      #059669;
  --chart:    #0BA97A;
  --dot-good: #22C55E;
  --dot-bad:  #EF4444;
  --good:     #10B981;
  --warn:     #F59E0B;
  --crit:     #EF4444;
}

*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
body {
  font-family:'Sora',system-ui,sans-serif;
  background:var(--bg);
  color:var(--tx1);
  font-size:13px;
  line-height:1.5;
  min-height:100vh;
}

/* ═══ FILTER BAR ═══ */
.fbar {
  background:var(--bar-bg);
  border-bottom:1px solid var(--border);
  padding:10px 20px;
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:10px;
  position:sticky;
  top:0;
  z-index:100;
}
.fbar-brand {
  font-size:14px;
  font-weight:700;
  color:var(--tx1);
  letter-spacing:-.3px;
  margin-right:6px;
  white-space:nowrap;
}
.fbar-sep {
  width:1px;
  height:22px;
  background:var(--border-2);
  flex-shrink:0;
}
.pill-group {
  display:flex;
  gap:2px;
}
.pill {
  padding:5px 13px;
  border-radius:20px;
  border:1px solid var(--border-2);
  background:none;
  color:var(--tx2);
  font-family:inherit;
  font-size:12px;
  font-weight:500;
  cursor:pointer;
  white-space:nowrap;
  transition:all .14s;
  letter-spacing:.1px;
}
.pill.on {
  background:var(--act-bg);
  border-color:var(--act-bg);
  color:var(--act-text);
}
.pill:hover:not(.on) {
  border-color:var(--border-2);
  background:var(--bg);
  color:var(--tx1);
}

/* date range */
.dr-wrap {
  margin-left:auto;
  display:flex;
  align-items:center;
  gap:6px;
  font-size:11.5px;
  color:var(--tx2);
  flex-shrink:0;
}
.dr-input {
  padding:4px 8px;
  border:1px solid var(--border-2);
  border-radius:6px;
  background:var(--card);
  color:var(--tx1);
  font-family:inherit;
  font-size:11.5px;
  cursor:pointer;
  outline:none;
}
.dr-input:focus { border-color:var(--act); }
.dr-clear {
  font-size:11px;
  color:var(--tx3);
  cursor:pointer;
  border:none;
  background:none;
  font-family:inherit;
  padding:0 4px;
  transition:color .14s;
}
.dr-clear:hover { color:var(--crit); }
.theme-btn {
  width:30px;height:30px;
  border-radius:6px;
  border:1px solid var(--border-2);
  background:none;
  cursor:pointer;
  display:grid;place-items:center;
  color:var(--tx2);
  flex-shrink:0;
  transition:all .14s;
}
.theme-btn:hover { background:var(--bg); color:var(--tx1); }

/* ═══ PRODUCT GRID ═══ */
.pgrid {
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:0;
  padding:0 20px 40px;
}
.pcol {
  border-right:1px solid var(--border);
  padding:0 16px;
}
.pcol:first-child { padding-left:0; }
.pcol:last-child  { border-right:none; padding-right:0; }

/* column header */
.pcol-head {
  display:flex;
  align-items:center;
  gap:8px;
  padding:18px 0 4px;
}
.pdot {
  width:10px;height:10px;
  border-radius:50%;
  flex-shrink:0;
}
.pname {
  font-size:16px;
  font-weight:700;
  color:var(--tx1);
  letter-spacing:-.3px;
}
.powner {
  font-size:11px;
  color:var(--tx3);
  padding-bottom:16px;
  display:flex;
  align-items:center;
  gap:6px;
}
.owner-av {
  width:20px;height:20px;
  border-radius:50%;
  display:grid;place-items:center;
  font-size:8px;
  font-weight:700;
  color:#fff;
  flex-shrink:0;
}
.ptag-small {
  font-size:9.5px;
  padding:1px 5px;
  border-radius:3px;
  border:1px solid var(--border-2);
  color:var(--tx3);
}

/* ═══ METRIC CARD ═══ */
.mcard {
  background:var(--card);
  border:1px solid var(--border);
  border-radius:10px;
  padding:14px 14px 10px;
  margin-bottom:10px;
}
.mc-row1 {
  display:flex;
  align-items:baseline;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:2px;
}
.mc-label {
  font-size:11px;
  font-weight:600;
  color:var(--tx3);
  letter-spacing:.5px;
  text-transform:uppercase;
}
.mc-val {
  font-family:'IBM Plex Mono',monospace;
  font-size:22px;
  font-weight:500;
  color:var(--tx1);
  font-variant-numeric:tabular-nums;
  letter-spacing:-.5px;
  line-height:1;
}
.mc-period {
  font-size:10px;
  font-weight:600;
  letter-spacing:.7px;
  color:var(--tx3);
  background:var(--bg);
  border:1px solid var(--border);
  border-radius:4px;
  padding:2px 6px;
  flex-shrink:0;
  align-self:center;
}
.mc-delta {
  font-size:11.5px;
  margin-bottom:8px;
  min-height:16px;
  display:flex;
  align-items:center;
  gap:4px;
  flex-wrap:wrap;
}
.delta-up   { color:var(--good); }
.delta-down { color:var(--crit); }
.delta-neu  { color:var(--tx3);  }
.mc-chart   { position:relative; }
.chart-empty {
  height:70px;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;color:var(--tx3);
}
.no-data-msg {
  font-size:11px;
  color:var(--tx3);
  text-align:center;
  padding:20px 0;
}

/* daily placeholder */
.daily-placeholder {
  height:90px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:6px;
  color:var(--tx3);
  font-size:11px;
  border:1px dashed var(--border-2);
  border-radius:8px;
  margin-top:4px;
}

/* ═══ RESPONSIVE ═══ */
@media(max-width:1100px) {
  .pgrid { grid-template-columns:1fr 1fr; }
  .pcol  { border-right:none; border-bottom:1px solid var(--border); }
  .pcol:last-child { border-bottom:none; }
}
@media(max-width:640px) {
  .pgrid { grid-template-columns:1fr; }
  .pgrid,.fbar { padding-left:14px; padding-right:14px; }
  .dr-wrap { margin-left:0; }
}
@media(prefers-reduced-motion:reduce){
  *{ transition:none!important; }
}

/* ═══════════════════════════════════
   CHART BUILDER
   ═══════════════════════════════════ */
function buildChart({ values, labels, lowerIsBetter, unit, color }) {
  color = color || getComputedStyle(document.documentElement).getPropertyValue('--chart').trim() || '#0BA97A';
  const W=280, H=108;
  const PL=6, PR=6, PT=22, PB=22;
  const cW=W-PL-PR, cH=H-PT-PB;

  const valid = values.filter(v => v!=null && !isNaN(v));
  if (!valid.length) return `<div class="chart-empty">No data</div>`;

  const mn = Math.min(...valid);
  const mx = Math.max(...valid);
  const spread = mx - mn;
  const pad = spread * 0.12 || mn * 0.08 || 1;
  const yMin = mn - pad;
  const yMax = mx + pad * 1.4;
  const yR = yMax - yMin;

  const toX = i => PL + (i / Math.max(values.length-1,1)) * cW;
  const toY = v => PT + cH - ((v - yMin) / yR) * cH;

  // Path segments
  let lineParts = [], prevX=null, prevY=null;
  const pts = [];
  values.forEach((v,i) => {
    if (v == null || isNaN(v)) { prevX=null; prevY=null; return; }
    const x = toX(i), y = toY(v);
    pts.push({x,y,v,i});
    lineParts.push(prevX==null ? `M${x.toFixed(1)},${y.toFixed(1)}` : `L${x.toFixed(1)},${y.toFixed(1)}`);
    prevX=x; prevY=y;
  });
  if (!pts.length) return `<div class="chart-empty">No data</div>`;

  const lp = pts[pts.length-1], fp = pts[0];
  const linePath = lineParts.join(' ');
  const fillPath = linePath + ` L${lp.x.toFixed(1)},${PT+cH} L${fp.x.toFixed(1)},${PT+cH} Z`;

  const lastI = pts[pts.length-1].i;
  const prevPt = pts.length >= 2 ? pts[pts.length-2] : null;
  const lastV  = pts[pts.length-1].v;
  const improved = prevPt == null || (lowerIsBetter ? lastV <= prevPt.v : lastV >= prevPt.v);
  const lastDotC = improved ? 'var(--dot-good)' : 'var(--dot-bad)';

  function fmtV(v) {
    if (unit === '%') return v.toFixed(1) + '%';
    if (unit === 'h') {
      if (v >= 100) return v.toFixed(1) + 'h';
      if (v >= 10)  return v.toFixed(1) + 'h';
      return v.toFixed(2) + 'h';
    }
    if (v >= 1000000) return (v/1000000).toFixed(2) + 'M';
    if (v >= 1000)    return (v/1000).toFixed(0) + 'K';
    return v.toFixed(0);
  }

  const gid = 'g'+(++_gid);

  const dotsHTML = pts.map(({x,y,v,i}) => {
    const isLast = i === lastI;
    const dc = isLast ? lastDotC : 'var(--tx4)';
    const r  = isLast ? 4 : 2.5;
    const lc = isLast ? lastDotC : 'var(--tx3)';
    const fw = isLast ? 500 : 400;
    return `<text x="${x.toFixed(1)}" y="${(y-8).toFixed(1)}" text-anchor="middle" font-size="9" fill="${lc}" font-family="'IBM Plex Mono',monospace" font-weight="${fw}">${fmtV(v)}</text>
<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r}" fill="${dc}" stroke="var(--card)" stroke-width="1.5"/>`;
  }).join('\n');

  const xHTML = labels.map((l,i) => {
    if (values[i]==null) return '';
    return `<text x="${toX(i).toFixed(1)}" y="${(PT+cH+14).toFixed(1)}" text-anchor="middle" font-size="9" fill="var(--tx3)" font-family="'Sora',sans-serif">${l}</text>`;
  }).join('\n');

  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="width:100%;height:${H}px;overflow:visible" role="img">
<defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0%" stop-color="${color}" stop-opacity="0.18"/>
  <stop offset="100%" stop-color="${color}" stop-opacity="0.01"/>
</linearGradient></defs>
<path d="${fillPath}" fill="url(#${gid})"/>
<path d="${linePath}" fill="none" stroke="${color}" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
${dotsHTML}
${xHTML}
</svg>`;
}

/* ═══════════════════════════════════
   CARD HTML BUILDER
   ═══════════════════════════════════ */
function buildCard({ label, values, labels, latestLabel, prevLabel, unit, lowerIsBetter, chartColor }) {
  const valid = values.filter(v => v!=null && !isNaN(v));
  const latestV = values[values.length-1];
  const prevV   = values.length >= 2 ? values[values.length-2] : null;

  // Format main value
  function fmtMain(v) {
    if (v == null) return '—';
    if (unit==='%') return v.toFixed(1);
    if (unit==='h') {
      if (v>=100) return v.toFixed(1);
      if (v>=10)  return v.toFixed(2);
      return v.toFixed(2);
    }
    if (v>=1000000) return (v/1000000).toFixed(2)+'M';
    if (v>=1000)    return (v/1000).toFixed(0)+','+String(v).padStart(6,'0').slice(-3);
    return v.toFixed(0);
  }

  // Format number with commas
  function fmtComma(v) {
    if (v==null) return '—';
    return Math.round(v).toLocaleString();
  }

  let displayVal = unit==='count' ? fmtComma(latestV) : (fmtMain(latestV) + (unit&&unit!=='count'?'<span style="font-size:13px;color:var(--tx3);font-weight:400;margin-left:1px">'+unit+'</span>':''));

  // Delta
  let deltaHTML = '';
  if (latestV != null && prevV != null && prevLabel) {
    const diff = latestV - prevV;
    const absDiff = Math.abs(diff);
    const improved = lowerIsBetter ? diff <= 0 : diff >= 0;
    const cls = improved ? 'delta-up' : 'delta-down';
    const arrow = diff > 0 ? '↑' : '↓';
    let fmtDiff;
    if (unit==='%') fmtDiff = (diff>0?'+':'')+diff.toFixed(1)+'pp';
    else if (unit==='h') fmtDiff = (diff>0?'+':'')+diff.toFixed(1)+'h';
    else if (unit==='count') fmtDiff = (diff>0?'+':'')+Math.round(diff).toLocaleString();
    else fmtDiff = (diff>0?'+':'')+absDiff.toFixed(0);
    deltaHTML = `<span class="${cls}">${arrow} ${fmtDiff}</span> <span class="delta-neu">vs ${prevLabel}</span>`;
  } else if (valid.length <= 1) {
    deltaHTML = `<span class="delta-neu">No prior period</span>`;
  }

  const chart = S.view === 'daily'
    ? `<div class="daily-placeholder"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--tx3)" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>Daily granularity coming soon</div>`
    : buildChart({ values, labels, lowerIsBetter, unit: unit==='count'?'':unit, color: chartColor });

  return `
    <div style="margin-bottom:10px">
      <div style="font-size:11px;font-weight:600;color:var(--tx3);letter-spacing:.6px;text-transform:uppercase;margin-bottom:6px">${label}</div>
    </div>
    <div class="mc-row1">
      <span class="mc-val">${displayVal}</span>
      <span class="mc-period">${latestLabel || '—'}</span>
    </div>
    <div class="mc-delta" style="margin-bottom:8px">${deltaHTML}</div>
    <div class="mc-chart">${chart}</div>`;
}

/* ═══════════════════════════════════
   RENDER FUNCTIONS
   ═══════════════════════════════════ */
function getMonthSeries(data) {
  return S.months.map(m => data[m] ?? null);
}

function renderProductCard(prod, metric) {
  const el = document.getElementById(`card-${prod}-${metric}`);
  if (!el) return;

  const dim = S.dim, seg = S.seg;
  const lowerIsBetter = metric === 'p99';
  const unit = metric === 'p99' ? 'h' : '%';
  const label = metric === 'p99' ? 'TAT (P99)' : (prod==='Image'||prod==='360') ? 'SLA < 6 Hrs' : 'SLA < 12 Hrs';

  let values, labels, latestLabel, prevLabel, chartColor;

  if (S.view === 'monthly') {
    const data = MONTHLY[dim]?.[prod]?.[metric]?.[seg] || {};
    values = getMonthSeries(data);
    labels = [...S.months];
    latestLabel = S.months[S.months.length-1].toUpperCase();
    prevLabel   = S.months.length >= 2 ? S.months[S.months.length-2] : null;
    chartColor  = getComputedStyle(document.documentElement).getPropertyValue('--chart').trim();
  } else if (S.view === 'weekly') {
    const weekData = WEEKLY[prod]?.[metric]?.[seg];
    if (weekData) {
      values = weekData;
    } else {
      values = [null,null,null,null];
    }
    labels      = WEEKLY_LABELS;
    latestLabel = 'W4';
    prevLabel   = 'W3';
    chartColor  = getComputedStyle(document.documentElement).getPropertyValue('--chart').trim();
  } else {
    // daily
    values      = [null,null,null,null,null,null,null];
    labels      = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
    latestLabel = 'TODAY';
    prevLabel   = null;
    chartColor  = getComputedStyle(document.documentElement).getPropertyValue('--chart').trim();
  }

  el.innerHTML = buildCard({ label, values, labels, latestLabel, prevLabel, unit, lowerIsBetter, chartColor });
}

function renderCatalogCards() {
  const seg = S.seg;

  // Accounts
  const accEl = document.getElementById('card-Catalog-accounts');
  if (accEl) {
    let values, labels, latestLabel, prevLabel;
    if (S.view === 'monthly') {
      const data = CAT_MONTHLY.accounts[seg] || {};
      values = getMonthSeries(data);
      labels = [...S.months];
      latestLabel = S.months[S.months.length-1].toUpperCase();
      prevLabel   = S.months.length >= 2 ? S.months[S.months.length-2] : null;
    } else if (S.view === 'weekly') {
      if (seg === 'Overall') {
        values = WEEKLY.Catalog.accounts;
      } else {
        values = WEEKLY.Catalog.accountsBySegs[seg] || [null,null,null,null];
      }
      labels=[...WEEKLY_LABELS]; latestLabel='W4'; prevLabel='W3';
    } else {
      values=[null,null,null,null,null,null,null];
      labels=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
      latestLabel='TODAY'; prevLabel=null;
    }
    accEl.innerHTML = buildCard({ label:'Live Accounts', values, labels, latestLabel, prevLabel, unit:'count', lowerIsBetter:false });
  }

  // Reviews
  const revEl = document.getElementById('card-Catalog-reviews');
  if (revEl) {
    let values, labels, latestLabel, prevLabel;
    if (S.view === 'monthly') {
      const data = CAT_MONTHLY.reviews[seg] || {};
      values = getMonthSeries(data);
      labels = [...S.months];
      latestLabel = S.months[S.months.length-1].toUpperCase();
      prevLabel   = S.months.length >= 2 ? S.months[S.months.length-2] : null;
    } else if (S.view === 'weekly') {
      if (seg === 'Overall') {
        values = WEEKLY.Catalog.reviews;
      } else {
        values = WEEKLY.Catalog.reviewsBySegs[seg] || [null,null,null,null];
      }
      labels=[...WEEKLY_LABELS]; latestLabel='W4'; prevLabel='W3';
    } else {
      values=[null,null,null,null,null,null,null];
      labels=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
      latestLabel='TODAY'; prevLabel=null;
    }
    revEl.innerHTML = buildCard({ label:'Website Reviews', values, labels, latestLabel, prevLabel, unit:'count', lowerIsBetter:false });
  }
}

function renderAll() {
  ['Image','360','Video'].forEach(prod => {
    renderProductCard(prod, 'p99');
    renderProductCard(prod, 'sla');
  });
  renderCatalogCards();
}

/* ═══════════════════════════════════
   CONTROLS
   ═══════════════════════════════════ */
function setView(v) {
  S.view = v;
  document.querySelectorAll('[data-view]').forEach(b => b.classList.toggle('on', b.dataset.view===v));
  renderAll();
}
function setSeg(s) {
  S.seg = s;
  document.querySelectorAll('[data-seg]').forEach(b => b.classList.toggle('on', b.dataset.seg===s));
  renderAll();
}
function setDim(d) {
  S.dim = d;
  document.querySelectorAll('[data-dim]').forEach(b => b.classList.toggle('on', b.dataset.dim===d));
  renderAll();
}

function setRange() {
  const from = document.getElementById('dr-from').value;
  const to   = document.getElementById('dr-to').value;
  if (!from || !to) { S.months = [...ALL_MONTHS]; renderAll(); return; }
  if (from > to) return;
  S.months = ALL_MONTHS.filter(m => MONTH_MAP[m] >= from && MONTH_MAP[m] <= to);
  if (!S.months.length) S.months = [...ALL_MONTHS];
  renderAll();
}

function clearRange() {
  document.getElementById('dr-from').value = '2025-06';
  document.getElementById('dr-to').value   = '2025-09';
  S.months = [...ALL_MONTHS];
  renderAll();
}

function toggleTheme() {
  const r = document.documentElement;
  const cur = r.getAttribute('data-theme');
  const sys = window.matchMedia('(prefers-color-scheme:dark)').matches;
  if (!cur)            r.setAttribute('data-theme', sys?'light':'dark');
  else if(cur==='dark') r.setAttribute('data-theme','light');
  else                  r.removeAttribute('data-theme');
  renderAll();
}

/* init */
document.addEventListener('DOMContentLoaded', renderAll);
